<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chronos Quest v2.0 - UTT Mobile</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
</head>
<body class="theme-forest">
    <div id="game-container">
        <header>
            <div class="logo">
                <h1>CHRONOS QUEST <span>v2.0</span></h1>
            </div>
            <div class="stats">
                <div class="stat-item">分數: <span id="score">0</span></div>
                <div class="stat-item">生命: <span id="lives">3</span></div>
                <div class="stat-item">區域: <span id="level-name">翠綠森林</span></div>
            </div>
            <div class="actions">
                <button id="auto-play-toggle" class="mini-btn secondary">🤖 自動: OFF</button>
                <button id="audio-toggle" class="mini-btn">🔊 音樂</button>
            </div>
        </header>

        <main>
            <style>
                /* Mobile Optimizations */
                @media (max-width: 1000px) {
                    #gameCanvas {
                        width: 100%;
                        height: auto;
                        max-height: 80vh;
                    }
                    .container {
                        padding: 10px;
                        width: 95vw;
                    }
                    .header {
                        flex-direction: column;
                        gap: 10px;
                    }
                    .title { font-size: 1.5rem; }
                }
                
                body {
                    touch-action: none; /* 防止手機瀏覽器縮放與滑動干擾 */
                    overflow: hidden;
                }
            </style>
            <!-- Boss HUD -->
            <div id="boss-hud" class="hidden">
                <p class="boss-label">⚠️ BOSS INCOMING ⚠️</p>
                <div class="hp-bar-container">
                    <div id="boss-hp" class="hp-bar-fill"></div>
                </div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <!-- Start/Overlay UI -->
            <div id="overlay" class="overlay active">
                <div class="overlay-content">
                    <h2 id="overlay-title">時空冒險啟動</h2>
                    <p id="overlay-desc">請選擇您的初始降落地點，指揮官 Patricia Hsu。</p>
                    
                    <div class="level-selector">
                        <button class="lvl-btn active" data-level="1">🌲 翠綠森林</button>
                        <button class="lvl-btn" data-level="2">🏜️ 黃金沙漠</button>
                        <button class="lvl-btn" data-level="3">🌊 碧藍深海</button>
                    </div>

                    <button id="start-btn">進入時空門</button>
                </div>
            </div>
        </main>

        <footer>
            <p>DESIGNED BY UTT-v2.0 | JENSEN • XAVIER • ADA</p>
        </footer>
    </div>

    <script src="scripts/game.js"></script>
</body>
</html>
